<div>
    <label for="price">Enter Max Price:</label>
    <input type="number" id="price" [(ngModel)]="price" (change)="onPriceChange()" placeholder="Enter max price" />
    <button (click)="onPriceChange()">Enter</button> 
</div>

<div>
    <label for="typeFilter">Filter by Type:</label>
    <select id="typeFilter" [(ngModel)]="selectedType" (change)="onTypeChange()">
        <option value="">All</option>
        <option *ngFor="let type of types" [value]="type.id">{{ type.type }}</option>
    </select>
</div>

<div id="list">
    <div *ngFor="let toy of list(); trackBy: trackById">
        <app-single [toy]="toy"></app-single>
    </div>
    <p *ngIf="list().length === 0">loading...</p>
</div>
